<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 발생 - 자동 블로그 포스팅 프로그램</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">오류가 발생했습니다</h5>
                    </div>
                    <div class="card-body text-center">
                        <div class="display-1 text-danger mb-4">
                            <i class="bi bi-exclamation-circle"></i>
                        </div>
                        <h4 class="mb-4">{{ message }}</h4>
                        <p class="text-muted">다음 단계에 따라 문제를 해결해보세요:</p>
                        <ul class="list-group list-group-flush text-start mb-4">
                            <li class="list-group-item">1. URL이 올바른지 확인하세요.</li>
                            <li class="list-group-item">2. 인터넷 연결을 확인하세요.</li>
                            <li class="list-group-item">3. 구글 계정이 올바르게 인증되었는지 확인하세요.</li>
                            <li class="list-group-item">4. 다시 시도해보세요.</li>
                        </ul>
                        <a href="/" class="btn btn-primary">처음으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
