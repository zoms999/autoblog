<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동 블로그 포스팅 프로그램</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="text-center my-5">
            <h1 class="fw-bold">자동 블로그 포스팅 프로그램</h1>
            <p class="text-muted">URL을 입력하여 컨텐츠를 스크랩하고 구글 블로그에 포스팅하세요</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">스크랩 정보 입력</h5>
                    </div>
                    <div class="card-body">
                        <form id="scrapeForm">
                            <div class="mb-3">
                                <label for="url" class="form-label">스크랩할 URL</label>
                                <input type="url" class="form-control" id="url" name="url" placeholder="https://example.com" required>
                                <div class="form-text">스크랩할 웹 페이지의 URL을 입력하세요.</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="app_info" class="form-label">앱 정보</label>
                                <input type="text" class="form-control" id="app_info" name="app_info" placeholder="앱 이름, 버전 등" required>
                                <div class="form-text">포스팅에 추가할 앱 정보를 입력하세요.</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="category" class="form-label">블로그 카테고리</label>
                                <input type="text" class="form-control" id="category" name="category" placeholder="카테고리명 (쉼표로 구분)">
                                <div class="form-text">포스팅할 블로그 카테고리를 입력하세요. 여러 개인 경우 쉼표로 구분합니다.</div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="scrapeBtn">
                                    <span class="spinner-border spinner-border-sm d-none" id="loadingSpinner" role="status" aria-hidden="true"></span>
                                    스크랩 시작
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 결과 프리뷰 (초기에는 숨겨져 있음) -->
                <div class="card mt-4 shadow d-none" id="previewCard">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">스크랩 결과 미리보기</h5>
                    </div>
                    <div class="card-body">
                        <h4 id="previewTitle"></h4>
                        <hr>
                        <div id="previewContent" class="mb-3"></div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="/preview" class="btn btn-outline-primary">상세 미리보기</a>
                            <button id="postBtn" class="btn btn-success">블로그에 포스팅</button>
                        </div>
                    </div>
                </div>

                <!-- 알림 메시지 -->
                <div class="alert alert-success mt-3 d-none" id="successAlert" role="alert"></div>
                <div class="alert alert-danger mt-3 d-none" id="errorAlert" role="alert"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
